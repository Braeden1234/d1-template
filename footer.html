        <p class="footer-text">
          Get the latest issues, updates, and space stories straight to your inbox.
        </p>

        <form id="myAppForm">
          <input
            id="emailInput"
            type="email"
            placeholder="Enter your email"
            required
          >
          <button type="submit">Subscribe</button>
        </form>

<script>
document.getElementById("myAppForm").addEventListener("submit", async (e) => {
  e.preventDefault(); // ⛔ stop page reload

  const email = document.getElementById("emailInput").value;

  const response = await fetch(
    "https://email-api.braeden-belvedere.workers.dev",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    }
  );

  if (response.ok) {
    alert("Email saved");
    document.getElementById("emailInput").value = "";
  } else {
    alert("Error saving email");
  }
});
</script>
